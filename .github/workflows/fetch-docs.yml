name: Fetch AI Provider Docs

on:
  schedule:
    # Four times daily: 01:00, 06:00, 11:00, 16:00 UTC (aligned with hn-digest)
    - cron: "0 1,6,11,16 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14t
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: "true"
          cache-python: "true"

      - name: Fetch all docs (Anthropic, OpenAI, Z.AI)
        run: uv run scripts/fetcher.py

      - name: Setup Git
        run: |
          git --version
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # No LLM triage here (that used to be a Claude Code agent step, which
      # needed a GitHub App + a Claude Code OAuth token as repo secrets --
      # neither of which forks inherit, so it only ever ran on the upstream
      # repo). This is a deterministic stand-in: the same signal rules,
      # applied with grep/jq instead of judgment. It runs no side effects
      # either -- everything with a side effect stays in Publish decision.
      - name: Decide signal
        run: |
          set -euo pipefail
          mkdir -p .decision

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working tree clean - nothing to publish."
            exit 0
          fi

          SIGNAL=minor
          REASONS=()

          # A page reaped (deleted) is always real editorial news, never minor.
          if git status --porcelain | grep -qE '^.D '; then
            SIGNAL=high
            REASONS+=("files were deleted (reaped -- gone upstream)")
          fi
          # Both files are themselves the highest-value signal the fetcher can
          # produce: a page dying/reviving, or a whole new source found.
          if ! git diff --quiet -- tombstones.json 2>/dev/null; then
            SIGNAL=high
            REASONS+=("tombstones.json changed (a page died or came back)")
          fi
          if ! git diff --quiet -- discovery.json 2>/dev/null; then
            SIGNAL=high
            REASONS+=("discovery.json changed (a new source may exist)")
          fi
          # A Claude Code version bump / CHANGELOG update is routine (ships
          # almost every run) and not risky on its own -- it self-merges like
          # any other minor content change. Only reap/tombstones/discovery
          # (something disappearing, dying, or a new source appearing) holds
          # for a human look.

          VERSION=$(jq -r '.version // empty' content/anthropic/claude-code-manifest.json 2>/dev/null || true)
          VERSION=${VERSION:-unknown}
          STAMP=$(date -u +%Y%m%d-%H%M)

          echo "$SIGNAL" > .decision/signal
          echo "$VERSION" > .decision/version

          if [ "$SIGNAL" = "high" ]; then
            echo "Claude Code v${VERSION} - docs update (${STAMP})" > .decision/title
          else
            echo "docs refresh (minor, ${STAMP})" > .decision/title
          fi

          {
            echo "## Automated docs refresh"
            echo
            if [ "${#REASONS[@]}" -gt 0 ]; then
              echo "Flagged for review:"
              for r in "${REASONS[@]}"; do echo "- $r"; done
              echo
            fi
            echo "### Files changed by section"
            git status --porcelain \
              | awk '{print $2}' \
              | awk -F/ '{print $1"/"$2}' \
              | sort | uniq -c | sort -rn
            echo
            echo "### Diffstat"
            echo '```'
            git diff --stat | tail -50
            echo '```'
          } > .decision/body.md

      # Deterministic publisher: everything with side effects lives here, in
      # plain bash with real error propagation - no agent permissions involved.
      # No PR flow: every run commits straight to main. "high" signal still
      # gets a Bark push (if configured) since there's no PR to hold it for
      # review -- it's just a heads-up after the fact.
      - name: Publish decision
        env:
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
        run: |
          set -euo pipefail
          D=.decision

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working tree clean - nothing to publish."
            exit 0
          fi

          for f in signal version title body.md; do
            if [ ! -s "$D/$f" ]; then
              echo "::error::Tree has changes but $D/$f is missing/empty"
              git status --short | head -20
              exit 1
            fi
          done

          SIGNAL=$(tr -d '[:space:]' < "$D/signal")
          VERSION=$(tr -d '[:space:]' < "$D/version")
          TITLE=$(head -1 "$D/title")
          case "$SIGNAL" in high|minor) ;; *)
            echo "::error::Invalid signal '$SIGNAL' (want high|minor)"; exit 1;;
          esac

          git add -A
          git commit -m "docs: ${TITLE}"
          git push origin HEAD:main
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)"
          echo "Committed to main: $COMMIT_URL"

          if [ "$SIGNAL" = "high" ] && [ -n "${BARK_SERVER:-}" ] && [ -n "${BARK_DEVICES:-}" ]; then
            IFS=',' read -ra DEVICES <<< "$BARK_DEVICES"
            for dev in "${DEVICES[@]}"; do
              jq -n --arg k "$dev" --arg t "📦 Claude Code v${VERSION}" \
                --arg b "$TITLE" --arg u "$COMMIT_URL" \
                '{device_key:$k, title:$t, body:$b, url:$u, group:"Claude YOLO",
                  icon:"https://avatars.githubusercontent.com/in/1452392"}' \
              | curl -sS -X POST "$BARK_SERVER/push" \
                  -H 'Content-Type: application/json' -d @- \
              || echo "::warning::bark notification failed (commit is fine: $COMMIT_URL)"
            done
          fi

      # Tripwire kept as belt-and-suspenders: changes left uncommitted means
      # publishing silently failed. Fail loudly instead of lying green.
      - name: Verify outcome
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Workspace has uncommitted changes after publish step"
            git status --short | head -20
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
        run: |
          [ -n "${BARK_SERVER:-}" ] && [ -n "${BARK_DEVICES:-}" ] || exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra DEVICES <<< "$BARK_DEVICES"
          for dev in "${DEVICES[@]}"; do
            jq -n --arg k "$dev" --arg u "$RUN_URL" \
              '{device_key:$k, title:"🚨 docs pipeline failed", body:"needs human", url:$u, group:"Claude YOLO"}' \
            | curl -sS -X POST "$BARK_SERVER/push" -H 'Content-Type: application/json' -d @- || true
          done
